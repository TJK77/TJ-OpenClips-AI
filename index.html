<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Oclip Free by coding180</title>
<script src="/js/theme.js"></script>
<style>
:root{--accent-ink:#fff;--bg:#FAF6EF;--panel:#FFFFFF;--panel2:#F6F1E7;--line:rgba(27,21,35,.12);--fg:#1B1523;--body:#5B5468;--muted:#6F687C;--green:#0b8580;--red:#d63c42;--orange:#b7791f;--accent:#5B3DF5;--display:"Sora","Plus Jakarta Sans",system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#111214;--panel:#191a1d;--panel2:#202226;--line:rgba(255,255,255,.12);--fg:#F4F1EA;--body:#bdbfc5;--muted:#9b9da4;--green:#2dd4bf;--red:#ff7a5f;--orange:#f0b84e;--accent:#2dd4bf;--accent-ink:#06201d;color-scheme:dark}
:root[data-theme="dark"] html,:root[data-theme="dark"] body{color-scheme:dark}
.tgl{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:16px;cursor:pointer;line-height:1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--body);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color-scheme:light}
@font-face{font-family:"Sora";src:url(/fonts/sora-700.ttf) format("truetype");font-weight:700}@font-face{font-family:"Plus Jakarta Sans";src:url(/fonts/jakarta-400.ttf) format("truetype");font-weight:400}@font-face{font-family:"Plus Jakarta Sans";src:url(/fonts/jakarta-600.ttf) format("truetype");font-weight:600}
a{color:var(--fg)}
h1,h2{font-family:var(--display)}h1{font-size:20px;color:var(--fg);margin:0;font-weight:600}
h2{font-size:16px;color:var(--fg);margin:0 0 4px;font-weight:600}
h3{font-size:14px;color:var(--fg);margin:22px 0 8px;font-weight:600}
p{margin:0 0 12px}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--body);font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card>p.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 18px}
label.f{display:block;font-size:13px;color:var(--fg)}
label.f small{display:block;color:var(--muted);font-size:12px;margin:2px 0 6px;line-height:1.35}
input[type=text],input[type=password],input[type=number],select{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:0 10px;font:inherit;font-size:14px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--red);font-size:12px;margin-top:4px;min-height:0}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg);cursor:pointer;padding:4px 0}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.sw small{color:var(--muted);font-size:12px;display:block}
.btn{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 18px;background:none;border:0;color:var(--body);font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.st{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.st:first-of-type{border-top:0}
.st i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--red)}
.st.ok i{background:var(--green)}.st.opt i{background:var(--orange)}
.st b{color:var(--fg);font-weight:500;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat b{display:block;color:var(--fg);font-size:20px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--fg);word-break:break-all}
.scroll{overflow-x:auto;max-height:420px;overflow-y:auto}
.note{font-size:13px;margin-top:10px}
.note.ok{color:var(--green)}.note.bad{color:var(--red)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--body);margin-left:6px}
.login{max-width:380px;margin:12vh auto 0}
.hidden{display:none}
.tbl tr.off td{color:var(--muted)}.tbl tr.off td.id{color:var(--muted)}
.tbl tr[draggable]{cursor:grab}.tbl tr.over td{box-shadow:inset 0 2px 0 var(--accent)}
.tbl input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:0;vertical-align:middle}
.mv{white-space:nowrap}.mv button{width:28px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:11px;cursor:pointer;margin-left:3px}.mv button:disabled{opacity:.35;cursor:default}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
async function api(path, body, method) {
  const r = await fetch('/api/admin' + path, { method: method || (body ? 'POST' : 'GET'), headers: { 'x-clip-admin': '1', ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Something went wrong.'), d);
  return d;
}
let S = null, tab = 'overview', models = null;

async function boot() { return load(); }
async function load() { S = await api('/settings'); draw(); }

// ---------- form helpers ----------
const v = (k) => S.settings[k];
const field = (k, label, help, type = 'text', attrs = '') => `<label class="f">${label}<small>${help || ''}</small><input type="${type}" data-k="${k}" value="${esc(v(k) ?? '')}" ${attrs}><div class="err" data-e="${k}"></div></label>`;
const toggle = (k, label, help) => `<label class="sw"><input type="checkbox" data-k="${k}" ${v(k) ? 'checked' : ''}><span>${label}${help ? `<small>${help}</small>` : ''}</span></label>`;
const secret = (k, label, help) => `<label class="f">${label}<small>${help}</small><input type="password" data-k="${k}" autocomplete="off" placeholder="${v(k + '_set') ? 'Saved: ' + esc(v(k + '_mask')) + (v(k + '_from_env') ? ' (from .env)' : '') + '. Type to replace.' : 'Paste the key here'}"><div class="err" data-e="${k}"></div></label>`;
function collect(root) {
  const out = {};
  $$('[data-k]', root).forEach((el) => { const k = el.dataset.k; if (el.type === 'checkbox') out[k] = el.checked; else if (el.type === 'number') out[k] = el.value === '' ? '' : Number(el.value); else if (el.type === 'password') { if (el.value.trim()) out[k] = el.value.trim(); } else out[k] = el.value; });
  return out;
}
async function saveForm(root, extra = {}) {
  $$('[data-e]', root).forEach((e) => (e.textContent = ''));
  const note = $('#saved');
  try { const r = await api('/settings', { ...collect(root), ...extra }); S = r; models = null; draw(); const n = $('#saved'); if (n) { n.textContent = 'Saved.'; n.className = 'note ok'; } }
  catch (e) { for (const [k, m] of Object.entries(e.fields || {})) { const el = $(`[data-e="${k}"]`, root); if (el) el.textContent = m; } if (note) { note.textContent = e.message; note.className = 'note bad'; } }
}
const saveBar = `<div class="bar"><button class="btn pri" id="save">Save changes</button><span class="note" id="saved" style="margin:0"></span></div>`;
const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 172800 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} days ago`; };

// ---------- tabs ----------
const TABS = [['overview', 'Overview'], ['ai', 'AI models'], ['render', 'Rendering'], ['projects', 'Projects'], ['keys', 'Saved keys']];
const PAGES = {
  overview() {
    const s = S.stats, la = s.last_ai;
    return `<div class="card"><h2>Health</h2><p class="sub">Everything green means you get real clips.</p>${S.status.map((x) => `<div class="st ${x.ok ? 'ok' : x.optional ? 'opt' : ''}"><i></i><div><b>${esc(x.label)}</b>${esc(x.detail)}</div></div>`).join('')}</div>
    <div class="card"><h2>Status</h2><p class="sub">Up for ${Math.round(s.uptime_seconds / 60)} minutes · Node ${esc(s.node)}</p><div class="stats">
      ${[[s.processing, 'processing now'], [s.projects, 'projects stored'], [s.failed, 'failed'], [s.disk_mb + ' MB', 'video files on disk']].map(([b, l]) => `<div class="stat"><b>${esc(b)}</b><span>${l}</span></div>`).join('')}</div>
      ${la.at ? `<p class="note">Last AI request ${ago(la.at)}: ${la.model ? `answered by <b style="color:var(--fg)">${esc(la.model)}</b>` : 'every model failed'}${la.attempts.length ? ` after skipping ${la.attempts.map((a) => `${esc(a.model)} (${esc(a.reason)})`).join(', ')}` : ''}.</p>` : ''}</div>`;
  },
  ai() {
    const free = v('or_tier') === 'free';
    return `<div class="card"><h2>Moment picking (OpenRouter)</h2><p class="sub">The model reads the transcript and chooses, titles and scores the clips. Get a key at openrouter.ai/keys.</p>
      <div class="grid">${secret('or_key', 'OpenRouter API key', 'One key works for free and paid models.')}
      <div><label class="f">Which models to use<small>Free costs nothing but models are often rate limited. Paid is steadier and picks better moments.</small></label><div class="seg" id="tier"><button type="button" class="${free ? 'on' : ''}" data-t="free">Free</button><button type="button" class="${free ? '' : 'on'}" data-t="paid">Paid</button></div></div></div>
      <div style="height:14px"></div>
      ${toggle('or_fallback', 'Switch models automatically', 'When a model is rate limited, out of credits, gone or answers badly, try the next best model of the same kind. Keep this on for free models.')}
      <div class="grid" style="margin-top:12px">
        ${field('or_max_tries', 'Models to try per video', 'How many models may be tried before giving up.', 'number', 'min="1" max="12"')}
        ${free ? '' : field('or_max_price', 'Price limit, paid models', 'US dollars per million output tokens. Dearer models are never used automatically.', 'number', 'min="0.05" step="0.05"')}
      </div>
      <div class="row" style="margin-top:14px"><button class="btn" id="t-or" type="button">Check key</button><button class="btn" id="t-model" type="button">Send a test request</button><button class="btn" id="m-refresh" type="button">Refresh model list</button><button class="btn" id="m-cool" type="button">Clear cool-downs</button></div>
      <div class="note" id="or-note"></div>
      <h3>Models to use, best first <span class="pill">${free ? 'free' : 'paid'}</span><span class="pill" id="mode"></span></h3>
      <p class="sub" style="font-size:13px;color:var(--muted)">Only ticked models are used, from the top down. Untick the ones you do not want, and drag a row or use the arrows to change the order. "Test and rank" gives every ticked model a small clip-picking and caption-translation job and scores the answer out of 100 (one request per model${free ? ', which counts towards the daily free limit' : ''}).</p>
      <div class="row"><button class="btn pri" id="m-test" type="button">Test and rank</button><button class="btn" id="m-sort" type="button">Sort by test result</button><button class="btn" id="m-auto" type="button">Back to automatic</button></div>
      <div class="note" id="m-note"></div>
      <div id="chain" class="note">Loading…</div>
      <div class="scroll" id="mlist" style="margin-top:10px"></div></div>
    <div class="card"><h2>Speech to text</h2><p class="sub">Turns the video's audio into words with timestamps. Add several free services: when one runs out of quota or is rate limited, the next one takes over. Fill in only the ones you have.</p>
      ${toggle('stt_fallback', 'Switch services automatically', 'Try the next service when one fails or is out of quota.')}
      <div class="grid" style="margin-top:12px">${field('stt_order', 'Order tried', 'Comma separated: groq, cloudflare, deepgram, assemblyai, gladia. Daily-reset services first, one-time credits last.')}</div>
      <h3>Groq <span class="pill">about 8 h a day</span></h3>
      <div class="grid">${secret('groq_key', 'API key', 'console.groq.com/keys')}${field('groq_base', 'Service address', 'Leave as is for Groq.')}${field('stt_model', 'Model', 'For example whisper-large-v3-turbo.')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-stt="groq" type="button">Check key</button></div>
      <h3>Cloudflare Workers AI <span class="pill">about 3.5 h a day</span></h3>
      <div class="grid">${field('cf_account', 'Account ID', 'dash.cloudflare.com, right side of the Workers AI page.')}${secret('cf_key', 'API token', 'Create a token with the Workers AI permission.')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-stt="cloudflare" type="button">Check key</button></div>
      <h3>Deepgram <span class="pill">one-time credit</span></h3>
      <div class="grid">${secret('dg_key', 'API key', 'console.deepgram.com')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-stt="deepgram" type="button">Check key</button></div>
      <h3>AssemblyAI <span class="pill">one-time credit</span></h3>
      <div class="grid">${secret('aai_key', 'API key', 'assemblyai.com/dashboard')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-stt="assemblyai" type="button">Check key</button></div>
      <h3>Gladia <span class="pill">about 10 h a month</span></h3>
      <div class="grid">${secret('gl_key', 'API key', 'app.gladia.io')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-stt="gladia" type="button">Check key</button><button class="btn" id="stt-reset" type="button">Clear cool-downs</button></div>
      <div class="note" id="stt-note"></div><div class="note" id="stt-state">Loading…</div></div>${saveBar}`;
  },
  render() {
    return `<div class="card"><h2>Rendering</h2><p class="sub">How clips are cut, framed and exported.</p>
      ${toggle('tracking', 'Speaker tracking and smart layouts', 'Follow the speaker when cropping, and use Split, Three, Four and ScreenShare layouts when several faces or a screen recording are detected. Off = plain centre crop.')}
      ${toggle('watermark', 'Watermark on clips')}
      <div class="grid" style="margin-top:12px">${field('watermark_text', 'Watermark text')}${field('caption_font', 'Caption font', 'A font installed on the server, for example Arial.')}
      <label class="f">Best export quality<small>1080p looks better; 720p renders faster and uses less disk.</small><select data-k="max_export"><option value="1080p" ${v('max_export') === '1080p' ? 'selected' : ''}>1080p</option><option value="720p" ${v('max_export') === '720p' ? 'selected' : ''}>720p</option></select></label>
      ${field('ytdlp_proxy', 'Proxy for video links', 'Optional. Video sites often block servers; a proxy like http://user:pass@host:port fixes that.')}</div></div>${saveBar}`;
  },
  projects() {
    return `<div class="card"><h2>Projects</h2><p class="sub">Your projects. Deleting one removes its video files.</p><div class="row" style="margin-bottom:12px"><button class="btn danger" id="clean-all" type="button">Delete all finished projects</button><span class="note" id="p-note" style="margin:0"></span></div><div class="scroll" id="plist">Loading…</div></div>`;
  },
  keys() {
    return `<div class="card"><h2>Remove a saved key</h2><p class="sub">Keys are stored in data/settings.json on the server and are never shown here in full.</p><div class="row"><button class="btn danger" data-clear="or_key" type="button" ${v('or_key_set') && !v('or_key_from_env') ? '' : 'disabled'}>Remove OpenRouter key</button>${[['groq_key', 'Groq'], ['cf_key', 'Cloudflare'], ['dg_key', 'Deepgram'], ['aai_key', 'AssemblyAI'], ['gl_key', 'Gladia']].map(([k, n]) => `<button class="btn danger" data-clear="${k}" type="button" ${v(k + '_set') && !v(k + '_from_env') ? '' : 'disabled'}>Remove ${n} key</button>`).join('')}</div></div>`;
  },
};

function draw() {
  app.innerHTML = `<div class="top"><h1>Oclip Free by coding180 · Admin</h1><span class="sp"></span><a href="/" class="btn" style="display:inline-grid;place-items:center;text-decoration:none">Open the app</a><button class="tgl" id="tgl" aria-label="Switch light or dark theme" title="Switch light or dark theme">◐</button></div>
    <div class="tabs">${TABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div><div id="page">${PAGES[tab]()}</div>`;
  $('#tgl').onclick = () => window.clipTheme();
  $$('[data-tab]').forEach((b) => (b.onclick = async () => { tab = b.dataset.tab; if (tab === 'overview') S = await api('/settings'); draw(); }));
  const page = $('#page');
  $('#save') && ($('#save').onclick = () => saveForm(page));
  if (tab === 'ai') wireAi(page);
  if (tab === 'projects') wireProjects();
  if (tab === 'keys') {
    $$('[data-clear]').forEach((b) => (b.onclick = async () => { if (!confirm('Remove this key? Real clipping stops until a new key is saved.')) return; S = await api('/settings', { ['clear_' + b.dataset.clear]: true }); draw(); }));
  }
}

function wireAi(page) {
  const note = (id, msg, ok) => { const n = $(id); n.textContent = msg; n.className = 'note ' + (ok ? 'ok' : 'bad'); };
  $$('#tier button').forEach((b) => (b.onclick = () => saveForm(page, { or_tier: b.dataset.t, or_model: '' }))); // switching tier saves at once and resets the preferred model
  $('#t-or').onclick = async () => { try { const r = await api('/test-openrouter', { or_key: $('[data-k=or_key]').value }); const k = r.key; note('#or-note', `Key works${k.label ? ` (${k.label})` : ''}. ${k.limit_remaining !== null ? `$${Number(k.limit_remaining).toFixed(2)} left on this key.` : k.free_tier ? 'No credits bought yet: free models only, with a low daily limit.' : `$${k.usage.toFixed(2)} used so far.`}`, true); } catch (e) { note('#or-note', e.message); } };
  $('#t-model').onclick = async (ev) => { ev.target.disabled = true; note('#or-note', 'Asking the models…', true); try { const r = await api('/test-model', {}); note('#or-note', `Answered by ${r.model}${r.attempts.length ? `, after skipping ${r.attempts.map((a) => `${a.model} (${a.reason})`).join(', ')}` : ''}.`, true); } catch (e) { note('#or-note', `${e.message} ${(e.attempts || []).map((a) => `${a.model}: ${a.reason}`).join('; ')}`); } ev.target.disabled = false; loadModels(false); };
  $('#m-refresh').onclick = () => loadModels(true);
  // ----- pick, order and test the models -----
  const ml = $('#mlist'), rows = () => (models ? models[v('or_tier')] : []), onIds = () => rows().filter((m) => m.on).map((m) => m.id);
  const saveOrder = async (ids) => { try { S = { ...S, ...(await api('/settings', { ['or_order_' + v('or_tier')]: ids.join(',') })) }; await loadModels(false); } catch (e) { note('#m-note', Object.values(e.fields || {})[0] || e.message); } };
  ml.onchange = (ev) => { const tr = ev.target.closest('tr[data-id]'); if (!tr || !ev.target.matches('[data-pick]')) return; const id = tr.dataset.id; saveOrder(ev.target.checked ? [...onIds(), id] : onIds().filter((x) => x !== id)); };
  ml.onclick = (ev) => { const b = ev.target.closest('[data-mv]'), tr = ev.target.closest('tr[data-id]'); if (!b || !tr) return; const ids = onIds(), i = ids.indexOf(tr.dataset.id), j = i + Number(b.dataset.mv); if (i < 0 || j < 0 || j >= ids.length) return; [ids[i], ids[j]] = [ids[j], ids[i]]; saveOrder(ids); };
  let dragId = null;
  const clearOver = () => $$('tr.over', ml).forEach((x) => x.classList.remove('over'));
  ml.ondragstart = (ev) => { const tr = ev.target.closest?.('tr[draggable]'); if (!tr) return; dragId = tr.dataset.id; ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', dragId); };
  ml.ondragover = (ev) => { const tr = ev.target.closest?.('tr[draggable]'); if (!dragId || !tr) return; ev.preventDefault(); clearOver(); tr.classList.add('over'); };
  ml.ondragend = () => { dragId = null; clearOver(); };
  ml.ondrop = (ev) => { const tr = ev.target.closest?.('tr[draggable]'); if (!dragId || !tr) return; ev.preventDefault(); const all = onIds(), to = all.indexOf(tr.dataset.id), ids = all.filter((x) => x !== dragId); if (to >= 0 && tr.dataset.id !== dragId) { ids.splice(to, 0, dragId); saveOrder(ids); } dragId = null; clearOver(); };
  $('#m-auto').onclick = () => saveOrder([]);
  $('#m-sort').onclick = () => { const key = (m) => (!m.test?.at ? 0 : m.test.ok ? 1000 + m.test.score : -1); const on = rows().filter((m) => m.on); if (!on.some((m) => m.test?.at)) return note('#m-note', 'Nothing has been tested yet. Press "Test and rank" first.'); saveOrder(on.map((m, i) => [m, i]).sort((a, b) => key(b[0]) - key(a[0]) || a[1] - b[1]).map((x) => x[0].id)); };
  $('#m-test').onclick = async (ev) => {
    const todo = rows().filter((m) => m.on && !m.gone); if (!todo.length) return;
    const btn = ev.target; btn.disabled = true; let next = 0, done = 0, stop = '';
    const cell = (id) => $$('tr[data-id]', ml).find((tr) => tr.dataset.id === id)?.querySelector('[data-test]');
    const worker = async () => { while (next < todo.length && !stop) { const m = todo[next++], c = cell(m.id); if (c) c.textContent = 'testing…'; try { m.test = (await api('/models/test', { id: m.id })).test; const c2 = cell(m.id); if (c2) c2.innerHTML = testCell(m); } catch (e) { if (e.auth) stop = e.message; const c2 = cell(m.id); if (c2) c2.textContent = e.message; } done++; if ($('#m-note')) note('#m-note', `Tested ${done} of ${todo.length}…`, true); } };
    await Promise.all([worker(), worker()]); // two at a time keeps free keys under the per-minute limit
    btn.disabled = false; const wasCustom = models?.custom?.[v('or_tier')]; await loadModels(false);
    if ($('#m-note')) note('#m-note', stop || (wasCustom ? 'Testing finished. Your order was kept: press "Sort by test result" to put the best first.' : 'Testing finished. The models are now in order of their results, best first.'), !stop);
  };
  $('#m-cool').onclick = async () => { await api('/cooldowns/reset', {}); loadModels(false); };
  const KEYS = { groq: ['groq_key'], cloudflare: ['cf_key', 'cf_account'], deepgram: ['dg_key'], assemblyai: ['aai_key'], gladia: ['gl_key'] };
  $$('[data-stt]').forEach((btn) => (btn.onclick = async () => { const id = btn.dataset.stt, [k, acc] = KEYS[id]; try { const r = await api('/test-speech', { service: id, key: $(`[data-k=${k}]`).value, account: acc ? $(`[data-k=${acc}]`).value : '', groq_base: id === 'groq' ? $('[data-k=groq_base]').value : '' }); note('#stt-note', id === 'groq' && !r.model_found ? `Key works, but "${$('[data-k=stt_model]').value}" was not in the list.${r.whisper.length ? ' Available: ' + r.whisper.join(', ') : ''}` : `${id}: key works.`, id !== 'groq' || r.model_found); } catch (e) { note('#stt-note', `${id}: ${e.message}`); } }));
  const loadStt = async () => { try { const r = await api('/stt'); $('#stt-state').innerHTML = r.services.map((x) => `<b style="color:var(--fg)">${esc(x.name)}</b> ${!x.configured ? 'no key' : x.cooling ? `<span style="color:var(--orange)">resting ${x.cooling.seconds}s: ${esc(x.cooling.reason)}</span>` : 'ready'}${x.seconds_today ? `, ${Math.round(x.seconds_today / 60)} min used today` : ''}`).join(' &nbsp;·&nbsp; '); } catch {} };
  $('#stt-reset').onclick = async () => { await api('/stt/reset', {}); loadStt(); };
  loadStt();
  loadModels(false);
}
async function loadModels(refresh) {
  try { if (refresh || !models) models = await api('/models' + (refresh ? '?refresh=1' : '')); else models = { ...models, ...(await api('/models')) }; } catch (e) { $('#chain').textContent = e.message; return; }
  if (tab !== 'ai') return;
  const free = v('or_tier') === 'free', list = free ? models.free : models.paid, cool = Object.fromEntries(models.cooling.map((c) => [c.id, c]));
  const custom = models.custom[free ? 'free' : 'paid'], nOn = list.filter((m) => m.on).length, tries = v('or_max_tries');
  $('#mode').textContent = custom ? 'your order' : 'automatic order';
  $('#m-auto').disabled = !custom;
  $('#chain').innerHTML = (models.error ? `<span style="color:var(--orange)">${esc(models.error)}</span><br>` : '') + 'Tried right now: ' + (models.chain.length ? models.chain.map((id, i) => `${i + 1}. <b style="color:var(--fg)">${esc(id)}</b>`).join(' &nbsp;→&nbsp; ') : 'no models available. Refresh the list.') + (!S.settings.or_fallback ? '<br>Automatic switching is off, so only the first one is used.' : nOn > tries ? `<br>${nOn} models are ticked but at most ${tries} are tried per video ("Models to try per video"). Resting models are skipped.` : '') + (custom ? '' : '<br>Automatic order: models that did well in the test first, then untested ones by estimated rank, then the ones that did badly. Ticking, unticking or moving a model switches to your own order.');
  $('#mlist').innerHTML = `<table class="tbl"><tr><th>Use</th><th>#</th><th>Model</th><th>Context</th>${free ? '' : '<th>$ in / out per M</th>'}<th>Test result</th><th>State</th><th></th></tr>${list.map((m, i) => `<tr data-id="${esc(m.id)}" class="${m.on ? '' : 'off'}" ${m.on ? 'draggable="true"' : ''}><td><input type="checkbox" data-pick aria-label="Use ${esc(m.id)}" ${m.on ? 'checked' : ''}></td><td>${m.on ? i + 1 : ''}</td><td class="id">${esc(m.id)}</td><td>${m.gone ? '' : Math.round(m.context / 1000) + 'k'}</td>${free ? '' : `<td>${m.gone ? '' : `${m.in_per_m} / ${m.out_per_m}`}</td>`}<td data-test>${testCell(m)}</td><td>${m.gone ? '<span style="color:var(--orange)">no longer on OpenRouter, skipped</span>' : cool[m.id] ? `<span style="color:var(--orange)">resting ${cool[m.id].seconds}s: ${esc(cool[m.id].reason)}</span>` : 'ready'}</td><td class="mv">${m.on ? `<button type="button" data-mv="-1" aria-label="Move up" title="Move up" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" data-mv="1" aria-label="Move down" title="Move down" ${i === nOn - 1 ? 'disabled' : ''}>▼</button>` : ''}</td></tr>`).join('')}</table>`;
}
function testCell(m) {
  const t = m.test; if (!t || (!t.at && !t.busy)) return m.gone ? '' : 'not tested';
  const out = [];
  if (t.at) out.push(t.ok ? `<span title="${esc(t.notes.length ? 'Lost points for: ' + t.notes.join('; ') : 'Everything right')}"><b style="color:var(--${t.quality >= 80 ? 'green' : t.quality >= 50 ? 'fg' : 'red'})">${t.quality}/100</b> in ${t.seconds}s${t.notes.length ? `<br><small>${esc(t.notes.join('; '))}</small>` : ''}</span>` : `<span style="color:var(--red)">failed: ${esc(t.reason)}</span>`);
  if (t.busy && (!t.at || t.busy.at > t.at)) out.push(`<span style="color:var(--orange)">${t.at ? 'last try' : 'could not test'}: ${esc(t.busy.reason)}</span>`);
  return out.join('<br>') + ` <small style="color:var(--muted)">· ${ago(Math.max(t.at || 0, t.busy?.at || 0))}</small>`;
}
async function wireProjects() {
  const note = $('#p-note');
  const list = async () => {
    const rows = await api('/projects');
    $('#plist').innerHTML = rows.length ? `<table class="tbl"><tr><th>Title</th><th>Status</th><th>Min</th><th>Clips</th><th>Created</th><th></th></tr>${rows.map((p) => `<tr><td>${esc(p.title)}<span class="pill">${esc(p.engine)}</span></td><td>${esc(p.status)}</td><td>${p.minutes}</td><td>${p.clips}</td><td>${ago(p.createdAt)}</td><td><button class="btn danger" style="height:30px" data-del="${esc(p.id)}">Delete</button></td></tr>`).join('')}</table>` : 'No projects yet.';
    $$('[data-del]').forEach((b) => (b.onclick = async () => { if (!confirm('Delete this project and its files?')) return; try { await api('/projects/' + b.dataset.del, null, 'DELETE'); list(); } catch (e) { note.textContent = e.message; } }));
  };
  $('#clean-all').onclick = async () => { if (!confirm('Delete every finished and failed project?')) return; const r = await api('/cleanup', { all: true }); note.textContent = `Deleted ${r.deleted}.`; list(); };
  list();
}
